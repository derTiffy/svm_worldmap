<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>SVM Worldmap</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>

/* =========================
   ANIRON FONT
========================= */

@font-face{
  font-family:"Aniron";
  src:url("anirm___.ttf") format("truetype");
  font-weight:normal;
  font-style:normal;
}

@font-face{
  font-family:"Aniron";
  src:url("anirb___.ttf") format("truetype");
  font-weight:bold;
  font-style:normal;
}
  /* =========================
   ANIRON ELEMENTE
========================= */

#toolBox,
#toolBox button,

#mapSelector,
#mapSelector button,

#infoBox,

#measureBox,

#passwordDialog,
#passwordDialog h3,
#passwordDialog button,
#passwordDialog input,

#searchInput,

.leaflet-control.legend-control{

  font-family:"Aniron", serif;

}

  
html,body{
  margin:0;
  padding:0;
  height:100%;
  width:100%;
  background:#000;
}

#map{
  height:100vh;
  width:100%;
}

/* =========================
   EINHEITLICHER TOOLBOX STIL
========================= */

.toolbox-style{
  background:rgba(0,0,0,.82);
  border-radius:6px;
  box-shadow:0 0 8px rgba(0,0,0,.4);
}

/* =========================
   SUCHE
========================= */

#searchBox{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  z-index:1000;
  width:320px;
}

#searchInput{
  width:100%;
  padding:8px;
  font-size:14px;
  box-sizing:border-box;
  border:none;
}

#suggestions{
  background:white;
  max-height:200px;
  overflow-y:auto;
  border:1px solid #ccc;
}

.suggestion-item{
  padding:6px;
  cursor:pointer;
  font-family:"Aniron",serif;
}

.suggestion-item.selected{
  background:#4da3ff;
  color:black;
}

#infoBox{
  margin-top:5px;
  color:white;
  padding:8px 10px;
  font-size:13px;
}

/* =========================
   TOOLS RECHTS OBEN
========================= */

#toolBox{
  position:absolute;
  top:10px;
  right:10px;
  z-index:1000;
  padding:6px;
}

#toolBox button{
  display:block;
  width:140px;
  margin:4px 0;
  padding:6px;
  cursor:pointer;
  border:none;
  color:white;
  background:#444;
}

#toolBox button.active{
  background:#4da3ff;
  color:black;
  font-weight:bold;
}

/* =========================
   MAP AUSWAHL
========================= */

#mapSelector{
  position:absolute;
  right:10px;
  bottom:20px;
  z-index:1000;
  padding:6px;
}

#mapSelector button{
  display:block;
  width:140px;
  margin:4px 0;
  padding:6px;
  cursor:pointer;
  border:none;
  color:white;
  background:#444;
}

#mapSelector button.active{
  background:#4da3ff;
  color:black;
  font-weight:bold;
}

/* =========================
   MESSUNG
========================= */

#measureBox{
  position:absolute;
  top:120px;
  left:50%;
  transform:translateX(-50%);
  z-index:1000;
  color:white;
  padding:8px;
  font-size:14px;
  display:none;
}

#measureBox button{
  background:#4da3ff;
  border:none;
  padding:5px 10px;
  cursor:pointer;
}
.zoom-info-control{

  background:rgba(0,0,0,.82);

  color:white;

  font-family:"Aniron",serif;

  font-size:14px;

  text-align:center;

  padding:6px 10px;

  min-width:80px;

  border-radius:0 6px 6px 0;

  line-height:18px;

}

/* =========================
   PASSWORT DIALOG
========================= */

#passwordOverlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:3000;
}

#passwordDialog{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:300px;
  padding:15px;
  color:white;
}

#passwordDialog h3{
  margin:0 0 10px 0;
  font-size:16px;
}

#passwordDialog input{
  width:100%;
  box-sizing:border-box;
  padding:8px;
  margin-bottom:10px;
}

#passwordDialog button{
  width:100px;
  padding:6px;
  margin-right:5px;
  border:none;
  cursor:pointer;
}

.password-ok{
  background:#4da3ff;
}

.password-cancel{
  background:#444;
  color:white;
}

/* =========================
   LEGENDE
========================= */

.leaflet-control.legend-control{
  background:none;
  border:none;
  box-shadow:none;
  color:white;
  padding:8px;
  font-family:"Aniron",serif;
  font-size:14px;
  line-height:40px;
  text-shadow:2px 2px 3px black;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:12px;
  white-space:nowrap;
}

.legend-icon{
  width:49px;
  height:49px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:49px;
}

.legend-icon img{
  max-width:49px;
  max-height:49px;
}

</style>

</head>


<body>



<div id="searchBox">

  <input id="searchInput" placeholder="Eintrag suchen..." />

  <div id="suggestions"></div>

  <div id="infoBox" class="toolbox-style">
    Bereit
  </div>

</div>

<div id="measureBox" class="toolbox-style"></div>


   
<div id="toolBox" class="toolbox-style">

  <button id="modeCoords" class="active">
    Koordinaten
  </button>

  <button id="modeMeasure">
    Messen
  </button>

</div>

<div id="mapSelector" class="toolbox-style">

  <button id="mapMiddleearth" class="active">
    Mittelerde
  </button>

  <button id="mapTravel">
    Reisen
  </button>

  <button id="mapGM">
    SL
  </button>

</div>

<div id="passwordOverlay">

  <div id="passwordDialog" class="toolbox-style">

    <h3>Spielleiterkarte</h3>

    <input
      id="slPassword"
      type="password"
      placeholder="Passwort eingeben"
    >

    <button
      id="slOpen"
      class="password-ok">
      Öffnen
    </button>

    <button
      id="slCancel"
      class="password-cancel">
      Abbrechen
    </button>

  </div>

</div>

<div id="map"></div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


// =========================
// KARTE
// =========================


var map = L.map('map', {

  crs:L.CRS.Simple,

  minZoom:-2.25,

  maxZoom:5,

  zoomSnap:0.5,

  zoomDelta:0.5,

  wheelPxPerZoomLevel:120

});



const MAPS = {

  middleearth:
  "https://lh3.googleusercontent.com/d/1ITaHpJQKrllAPfGZrAFKz87NfOff9f8T=s11212?authuser=0",

  travel:
  "https://lh3.googleusercontent.com/d/1qZPySmQRDEiMgt9D0zWB6tbADWrSx2-S=s11212?authuser=0",

  gm:
  "https://lh3.googleusercontent.com/d/1DLatrrxcqUIF5CCI-BVGVQcg0MrBcseN=s11212?authuser=0"

};

var w = 11212;
var h = 9716;

var bounds = [
 [0,0],
 [h,w]
];

let currentOverlay =
L.imageOverlay(
  MAPS.middleearth,
  bounds
).addTo(map);



map.fitBounds(bounds);

map.setZoom(-2);

map.setMaxBounds(bounds);
map.options.maxBoundsViscosity = 1.0;
``
// =========================
// NO BLACK BORDER
// =========================

function keepMapInsideBounds(){

  const mapBounds =
  L.latLngBounds(bounds);

  map.panInsideBounds(
    mapBounds,
    {
      animate:false
    }
  );

}




// =========================
// VARIABLEN
// =========================


let allMarkers=[];

let currentMode="coords";

let measurePoints=[];

let measureLine=null;

let mapLegend=[];
let activeMap="middleearth";





// =========================
// KOORDINATEN
// =========================


const infoBox =
document.getElementById("infoBox");


map.on("click",function(e){


if(currentMode==="coords"){


let x=Math.round(e.latlng.lng);

let y=Math.round(e.latlng.lat);



infoBox.innerHTML =
"X: "+x+" | Y: "+y;



}


});





// =========================
// ICON SYSTEM
// =========================


function resolveIcon(icon){


if(!icon){

return "📍";

}



let value =
String(icon).trim();



if(value===""){

return "📍";

}




// Google Drive

if(value.includes("drive.google.com")){


let id =
value.match(/[-\w]{25,}/);



if(id){


return "https://drive.google.com/uc?export=view&id="+id[0];


}


}




return value;


}







function isImage(icon){


return (

icon.startsWith("http")

&&

(

icon.includes("googleusercontent")

||

icon.includes("drive.google")

||

icon.includes(".png")

||

icon.includes(".jpg")

||

icon.includes(".jpeg")

||

icon.includes(".webp")

)

);


}






function createMarkerIcon(icon,size){



let resolved =
resolveIcon(icon);



if(isImage(resolved)){



return L.icon({


iconUrl:resolved,


iconSize:[

size,

size

],


iconAnchor:[

size/2,

size

],


popupAnchor:[

0,

-size

],


shadowUrl:null


});



}





return L.divIcon({


html:

`
<div style="
font-size:${size}px;
transform:translate(-50%,-50%);
">
${resolved}
</div>
`,



className:"",


iconSize:[size,size],


iconAnchor:[

size/2,

size/2

]



});



}

// =========================
// KARTENWECHSEL
// =========================

function switchMap(mapType){

  if(activeMap===mapType){
    return;
  }

  activeMap=mapType;

  map.removeLayer(currentOverlay);

  currentOverlay =
  L.imageOverlay(
    MAPS[mapType],
    bounds
  ).addTo(map);

  updateMapButtons();

}


function updateMapButtons(){

  document
  .getElementById("mapMiddleearth")
  .classList.remove("active");

  document
  .getElementById("mapTravel")
  .classList.remove("active");

  document
  .getElementById("mapGM")
  .classList.remove("active");

  if(activeMap==="middleearth"){

    document
    .getElementById("mapMiddleearth")
    .classList.add("active");

  }

  if(activeMap==="travel"){

    document
    .getElementById("mapTravel")
    .classList.add("active");

  }

  if(activeMap==="gm"){

    document
    .getElementById("mapGM")
    .classList.add("active");

  }

}




// =========================
// GOOGLE SCRIPT
// =========================


const sheetURL =
"https://script.google.com/macros/s/AKfycbwGaaBeERsd4o-nj-aCABwaLsVMEEmuh8ou_-mHJVs33MeXwzgdTC94A0bvNuFXwcKhCQ/exec";



fetch(sheetURL)

.then(res=>res.json())

.then(data=>{


let pois=[];



if(Array.isArray(data)){


pois=data;


}

else{


pois=data.pois || [];

mapLegend=data.legend || [];


}



createMapLegend(mapLegend);





pois.forEach(row=>{


if(row.Approved!==true){

return;

}



const name=row.Name;

const x=parseFloat(row.X);

const y=parseFloat(row.Y);



if(!name || isNaN(x) || isNaN(y)){

return;

}



const zoomRequired =
Number(row["Ab Zoom"]) || 0;



const size =
Number(row["Markergröße"]) || 30;



const icon =
row["Icon"] || "📍";



let popup =
`
<div style="
font-family:'Aniron',serif;
font-weight:bold;
margin-bottom:6px;
">
${name}
</div>

<div style="
max-height:100px;
overflow-y:auto;
margin-top:4px;
font-family:sans-serif;
">
${row.Beschreibung || ""}
</div>
`;



if(
row.Wiki &&
String(row.Wiki).trim()!==""
){


popup +=
`
<br><br>
<a href="${row.Wiki}" target="_blank">
Wiki öffnen
</a>
`;

}



let marker =
L.marker(

[y,x],

{

icon:createMarkerIcon(icon,size)

}

)

.bindPopup(popup);

marker.on("click",function(){

  infoBox.innerHTML =
  name +
  " | X: " +
  Math.round(x) +
  " | Y: " +
  Math.round(y);

});





allMarkers.push({

name:name,

marker:marker,

zoom:zoomRequired,

x:x,

y:y

});



});



updateMarkerVisibility();


});
// =========================
// LEGENDE
// =========================


function createMapLegend(legend){


if(!legend || legend.length===0){

return;

}



let LegendControl =
L.Control.extend({


options:{

position:"topleft"

},



onAdd:function(){


let div =
L.DomUtil.create(
"div",
"legend-control"
);



legend.forEach(item=>{


let row =
document.createElement("div");

row.className =
"legend-item";



let icon =
resolveIcon(item.Icon);



let iconBox =
document.createElement("div");


iconBox.className =
"legend-icon";



if(isImage(icon)){


let img =
document.createElement("img");


img.src =
icon;


iconBox.appendChild(img);


}

else{


iconBox.innerHTML =
icon;


}



let text =
document.createElement("span");


text.innerHTML =
item.Typ;



row.appendChild(iconBox);

row.appendChild(text);


div.appendChild(row);



});




L.DomEvent.disableClickPropagation(div);



return div;


}


});



map.addControl(
new LegendControl()
);


}





// =========================
// ZOOM SICHTBARKEIT
// =========================


function updateMarkerVisibility(){


let zoom =
map.getZoom();



allMarkers.forEach(m=>{


if(zoom >= m.zoom){


if(!map.hasLayer(m.marker)){


m.marker.addTo(map);


}



}

else{


if(map.hasLayer(m.marker)){


map.removeLayer(m.marker);


}



}



});


}



map.on(
"zoomend",
function(){

  updateMarkerVisibility();

  updateZoomInfo();

  setTimeout(
    keepMapInsideBounds,
    1
  );

}
);
   
map.on(
"moveend",
keepMapInsideBounds
);
   
map.on(
"dragend",
keepMapInsideBounds
);

map.on(
"resize",
keepMapInsideBounds
);




// =========================
// SUCHE
// =========================


const searchInput =
document.getElementById("searchInput");


const suggestions =
document.getElementById("suggestions");
let selectedSuggestion = -1;




function searchPlaces(value){


let text =
value.toLowerCase();



return allMarkers.filter(m=>


m.name.toLowerCase()
.includes(text)


);



}

function updateSuggestionSelection(){

  const items =
  suggestions.querySelectorAll(
    ".suggestion-item"
  );

  items.forEach(item =>
    item.classList.remove("selected")
  );

  if(
    selectedSuggestion >= 0 &&
    selectedSuggestion < items.length
  ){
    items[selectedSuggestion]
    .classList.add("selected");
  }

}


searchInput.addEventListener(
"input",
function(){



let value =
this.value.trim();



suggestions.innerHTML="";
selectedSuggestion = -1;


if(!value){

return;

}



let results =
searchPlaces(value);



results.slice(0,10)
.forEach(m=>{


let div =
document.createElement("div");


div.className =
"suggestion-item";



div.innerHTML =
m.name;



div.onclick=function(){


goToMarker(m);


};



suggestions.appendChild(div);



});



});







searchInput.addEventListener(
"keydown",
function(e){

  let results =
  searchPlaces(
    this.value.trim()
  );

  if(e.key==="ArrowDown"){

    e.preventDefault();

    if(results.length > 0){

      selectedSuggestion++;

      if(
        selectedSuggestion >=
        results.length
      ){
        selectedSuggestion = 0;
      }

      updateSuggestionSelection();

    }

    return;

  }

  if(e.key==="ArrowUp"){

    e.preventDefault();

    if(results.length > 0){

      selectedSuggestion--;

      if(
        selectedSuggestion < 0
      ){
        selectedSuggestion =
        results.length - 1;
      }

      updateSuggestionSelection();

    }

    return;

  }

  if(e.key==="Enter"){

    if(
      selectedSuggestion >= 0 &&
      results[selectedSuggestion]
    ){

      goToMarker(
        results[selectedSuggestion]
      );

      return;

    }

    if(results.length > 0){

      goToMarker(results[0]);

    }
    else{

      this.value =
      "nicht vorhanden";

    }

  }

});






function goToMarker(m){

  let targetZoom =
  Math.min(
    m.zoom + 1,
    map.getMaxZoom()
  );

  map.flyTo(
    [m.y,m.x],
    targetZoom,
    {
      animate:true,
      duration:0.5
    }
  );

  setTimeout(function(){

    m.marker.openPopup();

  },600);

  searchInput.value =
  m.name;

  suggestions.innerHTML="";

}





// =========================
// TOOL UMSCHALTUNG
// =========================


const modeCoords =
document.getElementById("modeCoords");


const modeMeasure =
document.getElementById("modeMeasure");


const measureBox =
document.getElementById("measureBox");






modeCoords.onclick=function(){


currentMode="coords";



modeCoords.classList.add("active");

modeMeasure.classList.remove("active");



measureBox.style.display="none";



clearMeasurement();



};







modeMeasure.onclick=function(){



currentMode="measure";



modeMeasure.classList.add("active");

modeCoords.classList.remove("active");



measureBox.style.display="block";



measureBox.innerHTML =
"Messung aktiv<br>Punkte setzen";



};






// =========================
// MESSWERKZEUG
// =========================


map.on(
"click",
function(e){



if(currentMode!=="measure"){

return;

}



measurePoints.push(e.latlng);



if(measureLine){

map.removeLayer(measureLine);

}



measureLine =

L.polyline(

measurePoints,

{

color:"#4da3ff",

weight:3

}

)

.addTo(map);



updateMeasurement();



});







function updateMeasurement(){



let total=0;



for(
let i=1;
i<measurePoints.length;
i++
){


let dx =
measurePoints[i].lng -
measurePoints[i-1].lng;



let dy =
measurePoints[i].lat -
measurePoints[i-1].lat;



total +=

Math.sqrt(
dx*dx+dy*dy
);



}



let miles =
total / 1000 * 150;



let km =
miles * 1.60934;



measureBox.innerHTML =


"Punkte: "

+

measurePoints.length


+

"<br>Strecke: "

+

miles.toFixed(1)

+

" Meilen"

+

"<br>"

+

km.toFixed(1)

+

" km"

+

"<br><br>"

+

"<button onclick='clearMeasurement()'>Zurücksetzen</button>";



}








function clearMeasurement(){



measurePoints=[];



if(measureLine){


map.removeLayer(measureLine);


measureLine=null;


}



if(currentMode==="measure"){


measureBox.innerHTML =

"Messung aktiv<br>Punkte setzen";


}



}


// =========================
// PASSWORT DIALOG
// =========================

const passwordOverlay =
document.getElementById(
  "passwordOverlay"
);

const slPassword =
document.getElementById(
  "slPassword"
);

document
.getElementById("mapMiddleearth")
.onclick=function(){

  switchMap("middleearth");

};

document
.getElementById("mapTravel")
.onclick=function(){

  switchMap("travel");

};

document
.getElementById("mapGM")
.onclick=function(){

  slPassword.value="";

  passwordOverlay.style.display=
  "block";

};

document
.getElementById("slCancel")
.onclick=function(){

  passwordOverlay.style.display=
  "none";

};

document
.getElementById("slOpen")
.onclick=function(){

  if(
    slPassword.value==="SvM_SL"
  ){

    switchMap("gm");

    passwordOverlay.style.display=
    "none";

  }

  else{

    alert(
      "Falsches Passwort"
    );

  }

};

slPassword.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      document
      .getElementById("slOpen")
      .click();

    }

  }
);

// =========================
// ZOOM ANZEIGE
// =========================

function updateZoomInfo(){

  let z =
  map.getZoom();

  if(z === 0){

    zoomInfo.innerHTML =
    "Zoom: 0";

    return;

  }

  if(z > 0){

    zoomInfo.innerHTML =
    "Zoom: +" +
    z.toFixed(2);

    return;

  }

  zoomInfo.innerHTML =
  "Zoom: " +
  z.toFixed(2);

}
   // =========================
// ZOOM ANZEIGE
// =========================

let zoomInfoControl;

const ZoomInfoControl =
L.Control.extend({

  options:{
    position:"topleft"
  },

  onAdd:function(){

    const div =
    L.DomUtil.create(
      "div",
      "zoom-info-control"
    );

    zoomInfoControl = div;

    div.innerHTML =
    "Zoom<br>-2.0";

    return div;

  }

});

map.addControl(
  new ZoomInfoControl()
);

function updateZoomInfo(){

  let z =
  map.getZoom();

  if(!zoomInfoControl){
    return;
  }

  zoomInfoControl.innerHTML =
  "Zoom<br>" +
  (
    z > 0
    ? "+" + z.toFixed(1)
    : z.toFixed(1)
  );

}

// =========================
// START
// =========================


updateMarkerVisibility();
updateMapButtons();
keepMapInsideBounds();
updateZoomInfo();


</script>


</body>

</html>
